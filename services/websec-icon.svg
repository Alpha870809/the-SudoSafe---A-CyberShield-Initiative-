<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Web Security Icon with Continuous Animation -->
  <g id="websec-icon" filter="url(#glow)">
    <rect x="40" y="40" width="120" height="90" rx="5" fill="none" stroke="#ff0000" stroke-width="2">
      <animate attributeName="stroke-dasharray" values="420;410;420" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="stroke-width" values="2;3;2" dur="3s" repeatCount="indefinite"/>
    </rect>
    <line x1="40" y1="60" x2="160" y2="60" stroke="#ff0000" stroke-width="2">
      <animate attributeName="y1" values="60;62;60" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="60;62;60" dur="2s" repeatCount="indefinite"/>
    </line>
    <g>
      <circle cx="50" cy="50" r="3" fill="#ff0000">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite"/>
        <animate attributeName="r" values="2;3;2" dur="1.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="60" cy="50" r="3" fill="#ff0000">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite" begin="0.5s"/>
        <animate attributeName="r" values="2;3;2" dur="1.5s" repeatCount="indefinite" begin="0.5s"/>
      </circle>
      <circle cx="70" cy="50" r="3" fill="#ff0000">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite" begin="1s"/>
        <animate attributeName="r" values="2;3;2" dur="1.5s" repeatCount="indefinite" begin="1s"/>
      </circle>
    </g>
    <path d="M60 90 L140 90 M60 110 L120 110" stroke="#ff0000" stroke-width="2" stroke-linecap="round">
      <animate attributeName="stroke-width" values="2;3;2" dur="2s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
