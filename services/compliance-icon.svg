<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Compliance Icon with Animation -->
  <g id="compliance-icon" filter="url(#glow)">
    <rect x="60" y="40" width="80" height="120" rx="5" fill="none" stroke="#ff0000" stroke-width="2">
      <animate attributeName="stroke-dasharray" from="0 400" to="400 400" dur="4s" fill="freeze" repeatCount="indefinite" />
    </rect>
    <g>
      <path d="M75 70 L125 70" stroke="#ff0000" stroke-width="2">
        <animate attributeName="stroke-dasharray" from="0 50" to="50 50" dur="0.5s" fill="freeze" />
      </path>
      <path d="M75 90 L125 90" stroke="#ff0000" stroke-width="2">
        <animate attributeName="stroke-dasharray" from="0 50" to="50 50" dur="0.5s" fill="freeze" begin="0.3s" />
      </path>
      <path d="M75 110 L125 110" stroke="#ff0000" stroke-width="2">
        <animate attributeName="stroke-dasharray" from="0 50" to="50 50" dur="0.5s" fill="freeze" begin="0.6s" />
      </path>
      <path d="M85 130 L115 130" stroke="#ff0000" stroke-width="2">
        <animate attributeName="stroke-dasharray" from="0 30" to="30 30" dur="0.5s" fill="freeze" begin="0.9s" />
      </path>
    </g>
  </g>
</svg>