<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Red Team Icon with Continuous Animation -->
  <defs>
    <linearGradient id="redGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff0000;stop-opacity:1">
        <animate attributeName="stop-color" values="#ff0000;#990000;#ff0000" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#990000;stop-opacity:1">
        <animate attributeName="stop-color" values="#990000;#ff0000;#990000" dur="3s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <g id="redteam-icon" filter="url(#glow)">
    <circle cx="100" cy="100" r="90" fill="none" stroke="url(#redGradient)" stroke-width="2">
      <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="20s" repeatCount="indefinite"/>
    </circle>
    <path d="M70 80 L100 50 L130 80 L130 120 L100 150 L70 120Z" fill="none" stroke="#ff0000" stroke-width="2">
      <animate attributeName="stroke-width" values="2;3;2" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
    </path>
    <circle cx="100" cy="100" r="20" fill="#ff0000" opacity="0.3">
      <animate attributeName="r" values="15;20;15" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.4;0.2" dur="2s" repeatCount="indefinite"/>
    </circle>
    <path d="M85 85 L115 115 M115 85 L85 115" stroke="#ff0000" stroke-width="2">
      <animate attributeName="stroke-width" values="2;3;2" dur="1.5s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>