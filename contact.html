<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=Rajdhani:wght@400;500;700&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Sudosafe</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/contact.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>

    <section class="contact-form-section">
        <div class="contact-container">
            <div class="form-container">
                <h2 class="section-title">Get In Touch</h2>
                <form id="contactForm" class="animated-form">
                    <div class="form-row">
                        <div class="form-group">
                            <input type="text" id="firstName" name="firstName" required>
                            <label for="firstName">First name</label>
                        </div>
                        <div class="form-group">
                            <input type="text" id="lastName" name="lastName" required>
                            <label for="lastName">Last name</label>
                        </div>
                    </div>
                    <div class="form-group">
                        <input type="email" id="email" name="email" required>
                        <label for="email">Email address</label>
                    </div>
                    <div class="form-group">
                        <input type="text" id="country" name="country" required>
                        <label for="country">Country</label>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <input type="text" id="company" name="company" required>
                            <label for="company">Company</label>
                        </div>
                        <div class="form-group">
                            <input type="text" id="jobTitle" name="jobTitle" required>
                            <label for="jobTitle">Job Title</label>
                        </div>
                    </div>
                    <div class="form-group">
                        <textarea id="message" name="message" required></textarea>
                        <label for="message">Your message</label>
                    </div>
                    <button type="submit" class="submit-btn">
                        <span>Submit</span>
                    </button>
                </form>
            </div>
        </div>
    </section>

    <script>
        async function sendToDiscord(event) {
            event.preventDefault();

            const firstName = document.getElementById('firstName').value;
            const lastName = document.getElementById('lastName').value;
            const email = document.getElementById('email').value;
            const country = document.getElementById('country').value;
            const company = document.getElementById('company').value;
            const jobTitle = document.getElementById('jobTitle').value;
            const message = document.getElementById('message').value;

            // Encoded webhook URL (Base64)
            const encodedWebhook = "aHR0cHM6Ly9kaXNjb3JkLmNvbS9hcGkvd2ViaG9va3MvMTM0Mzk5NDg2Njg0OTU1MDM5Ny9MckhIWGhNQkRCRTE2dXVpclNoWHlLdGM3MzQxTEVUQ04weGR6NTdxZ0RxSUc3MVlCb1lZZEtqVmx1TDVjZ05weU82Sg==";

            // Decode Base64
            function decodeBase64(str) {
                return atob(str);
            }

            // Get decoded webhook URL
            const webhookUrl = decodeBase64(encodedWebhook);

            try {
                const response = await fetch(webhookUrl, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        embeds: [{
                            title: "New Contact Form Submission",
                            fields: [
                                { name: "First Name", value: firstName },
                                { name: "Last Name", value: lastName },
                                { name: "Email", value: email },
                                { name: "Country", value: country },
                                { name: "Company", value: company },
                                { name: "Job Title", value: jobTitle },
                                { name: "Message", value: message }
                            ]
                        }]
                    })
                });

                if (response.ok) {
                    alert("Thank you! Your message has been sent.");
                    event.target.reset();
                } else {
                    throw new Error('Submission failed');
                }
            } catch (error) {
                alert("Error sending message. Please try again later.");
            }
        }

        // Attach the function to the form
        document.getElementById('contactForm').addEventListener('submit', sendToDiscord);
    </script>

</body>
</html>
